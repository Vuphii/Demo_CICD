name: Auto Release CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Tai code ve
        uses: actions/checkout@v4

      - name: Chay kiem thu truoc khi phat hanh
        run: node math.test.js

      - name: Dang nhap GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build va day Docker Image len GHCR
        run: |
          docker build -t ghcr.io/vuphii/demo_cicd:${{ github.ref_name }} -t ghcr.io/vuphii/demo_cicd:latest .
          docker push ghcr.io/vuphii/demo_cicd:${{ github.ref_name }}
          docker push ghcr.io/vuphii/demo_cicd:latest

      - name: Tao ban phat hanh tren GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes