name: Auto Test CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Tai code ve
        uses: actions/checkout@v4

      - name: Dong goi Docker Image
        run: docker build -t demo-cicd-app .

      - name: Chay kiem thu ben trong Docker Container
        run: docker run --rm demo-cicd-app node math.test.js

